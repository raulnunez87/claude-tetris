<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="records-section hidden">
          <p id="record-badge" class="record-badge hidden">¡Nuevo récord!</p>
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <label for="name-input">¡Entras al top 5! Escribe tu nombre</label>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" />
              <button type="submit" id="save-name-btn" class="rec-btn">Guardar</button>
            </div>
          </form>
          <div id="over-records"></div>
          <p id="over-stats" class="records-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen hidden">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <button id="play-btn" class="rec-btn">Jugar</button>
        <p class="records-heading">MEJORES PUNTUACIONES</p>
        <div id="start-records"></div>
        <p id="start-stats" class="records-stats"></p>
        <button id="reset-records-btn" class="rec-btn rec-btn-secondary">Borrar records</button>
        <p class="start-hint">Pulsa <kbd>Enter</kbd> para jugar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
